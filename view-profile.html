  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {

      width: 480px;
      height: 100vh;
      overflow: hidden;
      background: var(--deep);
      flex-shrink: 0;
    }
    .hero {
      position: absolute !important;
      top: 0 !important; left: 0 !important; right: 0 !important;
      width: 100% !important;
      height: 300px !important; max-height: 300px !important;
      transform: none !important; border-radius: 0 !important;
    }
    .scroll-content { position: absolute !important; inset: 0 !important;
      left: 0 !important; right: 0 !important; width: 100% !important;
      transform: none !important;
    }
    .spacer { height: 280px !important; }
    .actions { position: absolute !important; bottom: 0 !important;
      left: 0 !important; right: 0 !important; width: 100% !important;
      transform: none !important;
    }
    .back-btn { position: absolute !important; top: 16px !important;
      left: 16px !important; transform: none !important;
    }
    .loader { position: absolute !important; }
    .nebula { display: none; }
  }

  /* ── LOADING ── */
  .loader {
    position: fixed; inset: 0; z-index: 999;
    display: flex; align-items: center; justify-content: center;
    background: var(--deep);
    transition: opacity 0.4s;
  }
  .loader.hide { opacity: 0; pointer-events: none; }
  .loader-pulse {
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid rgba(201,169,110,0.3);
    border-top-color: var(--gold);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── BACK BUTTON ── */
  .back-btn {
    position: fixed; top: 16px; left: 12px; z-index: 100;
    width: 28px; height: 28px; border-radius: 50%;
    background: #1A1530;
    border: 1px solid rgba(201,168,76,0.35);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s;
    opacity: 1;
  }
  .back-btn:hover { background: rgba(201,168,76,0.12); }

  /* ── HERO PHOTO ── */
  .hero {
    position: fixed; top: 0; left: 0; right: 0;
    height: 55vh;
    max-height: 420px;
    background-size: cover; background-position: center center;
    z-index: 0;
  }
  .hero::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(4,3,10,0.1) 0%, rgba(4,3,10,0.7) 70%, var(--deep) 100%);
  }

  /* ── SCROLL CONTENT ── */
  .scroll-content {
    position: fixed; inset: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .spacer { height: 42vh; }

  .profile-card {
    position: relative; z-index: 10;
    background: var(--deep);
    border-radius: 4px 4px 0 0;
    padding: 28px 24px 160px;
    min-height: 60vh;
  }

  /* ── CONNECTION BADGE ── */
  .conn-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 14px; border-radius: 4px;
    margin-bottom: 16px;
    font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase;
    border: 1px solid rgba(201,169,110,0.3);
    background: rgba(201,169,110,0.1);
    color: var(--gold);
  }
  .conn-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }

  /* ── NAME / AGE ── */
  .profile-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 38px; font-weight: 300; line-height: 1;
    margin-bottom: 6px;
  }
  .profile-age {
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 20px; font-weight: 200;
    color: rgba(232,224,213,0.5);
    margin-left: 12px;
  }

  /* ── META ── */
  .profile-meta {
    display: flex; align-items: center; gap: 12px;
    margin-top: 8px; margin-bottom: 24px;
  }
  .meta-origin {
    font-size: 11px; letter-spacing: 0.25em;
    text-transform: uppercase; color: var(--gold-soft); opacity: 0.8;
  }
  .meta-dot { color: var(--muted); font-size: 8px; }
  .meta-location { font-size: 11px; letter-spacing: 0.1em; color: var(--muted); }

  /* ── DIVIDER ── */
  .divider {
    height: 1px; background: var(--border);
    margin: 20px 0;
  }

  /* ── SECTION LABEL ── */
  .section-label {
    font-size: 9px; letter-spacing: 0.3em;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 10px;
  }

  /* ── BIO ── */
  .bio-text {
    font-size: 14px; line-height: 1.7;
    color: rgba(232,224,213,0.75);
    letter-spacing: 0.02em;
  }

  /* ── ORIGIN CARD ── */
  .origin-card {
    background: rgba(201,169,110,0.05);
    border: 1px solid rgba(201,169,110,0.12);
    border-radius: 4px;
    padding: 16px 18px;
    margin-top: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .origin-card:hover { background: rgba(201,169,110,0.1); }
  .origin-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px; font-weight: 300;
    color: var(--gold-soft);
    margin-bottom: 4px;
  }
  .origin-desc {
    font-size: 11px; color: var(--muted);
    letter-spacing: 0.05em; line-height: 1.6;
  }

  /* ── NEBULA ── */
  .nebula {
    position: fixed; border-radius: 50%;
    filter: blur(80px); pointer-events: none; z-index: 0; opacity: 0.04;
  }
  .nebula-1 { width: 300px; height: 300px; background: radial-gradient(circle, #c9a96e, transparent); top: -100px; right: -100px; }
  .nebula-2 { width: 250px; height: 250px; background: radial-gradient(circle, #7060a8, transparent); bottom: 100px; left: -80px; }

  /* ── ACTIONS ── */
  .actions {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;

    background: linear-gradient(to top, rgba(4,3,10,0.98) 60%, transparent);

  .btn-pass:hover { background: rgba(224,112,112,0.08); border-color: rgba(224,112,112,0.6); }
  .btn-like {

    background: rgba(201,169,110,0.08);
    border: 1px solid rgba(201,169,110,0.35);
    border-radius: 2px;
    color: var(--gold);
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase;

  @keyframes fadeUp {
    from { opacity: 0; transform: translateX(-50%) translateY(10px); }

function canonPair(a, b) {
  const d = CANON_PAIRS[a + "|" + b] || CANON_PAIRS[b + "|" + a];
  return d ? { verdict: CANON_VERDICT_NAMES[d[0]], tension_peak: d[1], tension_avg: d[2], pure: !!d[3] } : null;
}
function getConnectionType(origin1, origin2) {
  if (!origin1 || !origin2 || origin1 === "Unknown" || origin2 === "Unknown") return "Unknown"
  const p = canonPair(origin1, origin2)
  return p ? p.verdict : "Unknown"
}


  let profile = null
  let myProfile = null
  let myUser = null

  ;(async () => {
    const { data: { user } } = await sb.auth.getUser()
    if (!user) { window.location.href = 'index.html'; return }
    myUser = user

    const { data: me } = await sb.from('profiles').select('*').eq('id', user.id).single()
    myProfile = me

    // Try sessionStorage first (fast path from feed)
    const cached = sessionStorage.getItem('viewProfile')
    const params = new URLSearchParams(location.search)
    const profileId = params.get('id')

    if (cached) {
      try {
        const parsed = JSON.parse(cached)
        if (parsed.id === profileId) {
          profile = parsed
          sessionStorage.removeItem('viewProfile')
          render()
          return
        }
      } catch(e) {}
    }

    // Fallback: fetch from DB
    if (profileId) {
      // Try real profiles first
      let { data } = await sb.from('profiles').select('*').eq('id', profileId).single()
      if (!data) {
        // Try test profiles
        const { data: tp } = await sb.from('test_profiles').select('*').eq('id', profileId).single()
        if (tp) data = { ...tp, location_name: tp.location, is_test: true }
      }
      profile = data
    }

    if (!profile) { history.back(); return }
    render()
  })()

  function render() {
    // Hero photo
    document.getElementById('hero-photo').style.backgroundImage = `url('${profile.photo_url && profile.photo_url.trim() ? profile.photo_url : DEFAULT_PROFILE_IMAGE}')`

    // Name & age
    document.getElementById('profile-name').innerHTML =
      `${profile.name}<span class="profile-age">${profile.age || ''}</span>`

    // Origin & location
    const origin = profile.origin || ''
    const location = profile.location_name || profile.location || ''
    document.getElementById('meta-origin').textContent = origin
    if (location) {
      document.getElementById('meta-location').textContent = location
      document.getElementById('meta-dot').style.display = ''
    }

    // Connection type badge
    const connType = profile.connection_type || getConnectionType(myProfile?.origin, origin)
    if (connType && connType !== 'Unknown') {
      const theme = MATCH_THEMES[connType] || MATCH_THEMES['Cosmic Flow']
      document.getElementById('conn-dot').style.background = theme.badgeColor
      document.getElementById('conn-name').textContent = connType
      document.getElementById('conn-name').style.color = theme.badgeColor
      document.getElementById('conn-badge').style.display = 'inline-flex'
      document.getElementById('conn-badge').style.borderColor = theme.badgeColor + '33'
      document.getElementById('conn-badge').style.background = theme.badgeColor + '18'
    }

    // Origin description
    document.getElementById('origin-name').textContent = origin || '—'
    document.getElementById('origin-desc').textContent =
      ORIGIN_DESCRIPTIONS[origin] || 'A unique stellar traveller on their cosmic journey.'

    document.getElementById('loader').classList.add('hide')
  }

  async function doSwipe(action) {
    if (!profile || !myUser) return

    const btn = document.getElementById(action === 'like' ? 'btn-like' : 'btn-pass')
    btn.disabled = true
    btn.style.opacity = '0.5'

    if (action === 'like' && !profile.is_test) {
      // Insert like
      await sb.from('likes').upsert({
        from_user: myUser.id,
        to_user: profile.id,
        created_at: new Date().toISOString()
      }, { onConflict: 'from_user,to_user' })
    }

    showToast(action === 'like' ? '✦ Liked' : 'Passed')
    setTimeout(() => history.back(), 700)
  }

  function showToast(text) {
    const t = document.createElement('div')
    t.style.cssText = `position:fixed;bottom:120px;left:50%;transform:translateX(-50%);
      background:rgba(13,11,24,0.95);border:1px solid var(--border);border-radius:4px;
      padding:10px 20px;font-size:11px;letter-spacing:0.15em;color:var(--gold);
      z-index:500;animation:fadeUp 0.3s ease;pointer-events:none;`
    t.textContent = text
    document.body.appendChild(t)
    setTimeout(() => t.remove(), 2000)
  }
</script>
