<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Oli</title>
<meta name="description" content="Oli, a quiet companion for the relationship on your mind. Built on Alexandra's system.">
<meta name="theme-color" content="#050816">
<!-- App shell: installable as a PWA now, wrapped by Capacitor later. Paths stay relative. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Oli">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
<script src="vendor/supabase-2.45.4.js"></script>
<style>
  :root {
    --deep: #0a0a0a;
    --card: #161616;
    --border: rgba(201,169,110,0.12);
    --gold: #c9a96e;
    --gold-soft: rgba(201,169,110,0.75);
    --champagne: #e8d9bc;
    --text: #e8e4df;
    --muted: rgba(232,224,213,0.4);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--deep); color: var(--text); }
  body {
    font-family: 'Inter', -apple-system, sans-serif; font-weight: 300;
    display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
  }
  .hidden { display: none !important; }

  /* ── LOADER ── */
  #loader { flex: 1; display: flex; align-items: center; justify-content: center; }
  .spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid var(--border); border-top-color: var(--gold);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── LOGIN ── */
  #login {
    flex: 1; overflow-y: auto; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 40px 24px;
  }
  .login-box { width: 100%; max-width: 360px; text-align: center; }
  .oli-mark {
    width: 64px; height: 64px; margin: 0 auto 28px; border-radius: 50%;
    border: 1px solid rgba(201,169,110,0.35);
    background: radial-gradient(circle at 50% 45%, rgba(232,217,188,0.22), rgba(201,169,110,0.04) 62%, transparent 70%);
    box-shadow: 0 0 40px rgba(201,169,110,0.10);
  }
  .login-title {
    font-family: 'Cormorant Garamond', serif; font-weight: 300;
    font-size: 44px; letter-spacing: 0.04em; color: var(--champagne);
  }
  .login-sub {
    margin: 14px 0 36px; font-size: 13px; line-height: 1.7; color: var(--muted); letter-spacing: 0.02em;
  }

  /* The sphere draws itself, then the page appears. */
  #flames { display: block; width: 220px; height: 220px; margin: -10px auto 14px; }
  .intro { opacity: 0; transform: translateY(8px); animation: rise 1.2s ease forwards; }
  .intro-1 { animation-delay: 1.1s; }
  .intro-2 { animation-delay: 1.4s; }
  .intro-3 { animation-delay: 1.7s; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .intro { animation: none; opacity: 1; transform: none; }
  }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 14px 18px; border-radius: 4px; cursor: pointer;
    font-family: inherit; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
    transition: background 0.2s, border-color 0.2s;
  }
  /* One clear accent on the first screen: Google is primary; email stays quiet. */
  .btn-gold, .btn-line { font-weight: 400; }
  .btn-line { background: #FF7A1F; border: 1px solid #FF7A1F; color: #140A02; }
  .btn-line:hover { background: #FF8F3F; border-color: #FF8F3F; }
  .login-box .btn-gold { background: transparent; border: 1px solid rgba(201,169,110,0.35); color: var(--champagne); }
  .login-box .btn-gold:hover { background: rgba(255,122,31,0.10); border-color: rgba(255,122,31,0.65); color: #FFB078; }
  .btn-line svg path { fill: #140A02; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .or {
    display: flex; align-items: center; gap: 12px; margin: 22px 0;
    font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--muted);
  }
  .or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .field {
    width: 100%; margin-bottom: 12px; padding: 14px 16px; border-radius: 4px;
    background: var(--card); border: 1px solid var(--border); outline: none;
    color: var(--text); font-family: inherit; font-size: 14px; font-weight: 300; letter-spacing: 0.03em;
  }
  .field:focus { border-color: rgba(201,169,110,0.35); }
  .field::placeholder { color: var(--muted); }
  .field.code { text-align: center; font-size: 20px; letter-spacing: 0.4em; }
  .login-msg { min-height: 18px; margin-top: 14px; font-size: 12px; line-height: 1.6; color: var(--muted); }
  .login-msg.err { color: #d79a8a; }
  .link-btn {
    margin-top: 18px; background: none; border: none; cursor: pointer;
    color: var(--gold-soft); font-family: inherit; font-size: 11px; letter-spacing: 0.1em;
  }
  .login-note { margin-top: 40px; font-size: 10px; line-height: 1.7; color: var(--muted); letter-spacing: 0.05em; }
  .login-note a { color: var(--gold-soft); text-decoration: none; }

  /* ── CHAT ── */
  #chat { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .chat-head {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: calc(14px + env(safe-area-inset-top)) 18px 14px;
    border-bottom: 1px solid var(--border);
  }
  .chat-head-left { display: flex; align-items: center; gap: 12px; }
  .chat-head .oli-mark { width: 32px; height: 32px; margin: 0; }
  /* In the chat the same living crystal sits in the header and reacts while Oli thinks and answers. */
  .chat-head .oli-mark.has-halo { width: 48px; height: 48px; border: none; background: none; box-shadow: none; }
  .chat-head #flames { width: 48px; height: 48px; margin: 0; }
  .chat-name { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300; color: var(--champagne); line-height: 1; }
  .chat-tag { margin-top: 4px; font-size: 8px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold-soft); }
  .menu-btn {
    background: none; border: none; cursor: pointer; padding: 6px;
    color: var(--muted); font-family: inherit; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
  }
  .menu-btn:hover { color: var(--gold); }

  #messages {
    flex: 1; overflow-y: auto; padding: 24px 16px 12px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .inner { width: 100%; max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; }
  .msg.mine { justify-content: flex-end; }
  .bubble {
    max-width: 82%; padding: 12px 16px; white-space: pre-wrap; word-break: break-word;
    font-size: 14px; line-height: 1.6; letter-spacing: 0.01em;
  }
  .msg.oli .bubble { padding-left: 0; padding-right: 0; max-width: 100%; color: var(--text); }
  .bubble a { color: var(--gold); text-decoration: underline; text-underline-offset: 3px; word-break: break-all; }
  .msg.mine .bubble {
    border-radius: 16px 16px 4px 16px;
    background: rgba(201,169,110,0.1); border: 1px solid rgba(201,169,110,0.2);
  }
  .oli-action {
    display: block; margin-top: 14px; padding: 11px 16px;
    background: transparent; border: 1px solid rgba(201,169,110,0.45); border-radius: 10px;
    color: var(--gold); font: inherit; font-size: 13px; letter-spacing: 0.03em; cursor: pointer;
  }
  .oli-action:disabled { opacity: 0.4; cursor: default; }
  .msg-date {
    text-align: center; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--muted); padding: 6px 0;
  }
  .typing { display: flex; gap: 5px; padding: 6px 0; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--gold-soft);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

  .input-area {
    flex-shrink: 0; padding: 10px 16px calc(16px + env(safe-area-inset-bottom));
  }
  .input-wrap {
    max-width: 720px; margin: 0 auto; display: flex; align-items: flex-end; gap: 10px;
    background: var(--card); border: 1px solid var(--border); border-radius: 22px; padding: 8px 8px 8px 18px;
  }
  .input-wrap:focus-within { border-color: rgba(201,169,110,0.35); }
  #msg-input {
    flex: 1; background: none; border: none; outline: none; resize: none;
    color: var(--text); font-family: inherit; font-size: 15px; font-weight: 300; line-height: 1.45;
    max-height: 160px; padding: 7px 0;
  }
  #msg-input::placeholder { color: var(--muted); }
  .send-btn {
    flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
    background: rgba(201,169,110,0.18); border: 1px solid rgba(201,169,110,0.4); color: var(--gold);
    display: flex; align-items: center; justify-content: center;
  }
  .send-btn:disabled { opacity: 0.3; cursor: default; }
  .ai-note { max-width: 720px; margin: 8px auto 0; text-align: center; font-size: 10px; color: var(--muted); letter-spacing: 0.04em; }

  .menu {
    position: fixed; z-index: 10; top: calc(56px + env(safe-area-inset-top)); right: 14px;
    background: var(--card); border: 1px solid var(--border); border-radius: 4px; overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5); min-width: 170px;
  }
  .menu button {
    display: block; width: 100%; padding: 13px 18px; text-align: left; cursor: pointer;
    background: none; border: none; color: var(--text); font-family: inherit; font-size: 12px; letter-spacing: 0.08em;
  }
  .menu button:hover { background: rgba(201,169,110,0.06); }
  .menu button.danger { color: #d79a8a; }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .field:focus-visible, #msg-input:focus-visible { outline: none; }

  /* Calm notices inside the chat: lost connection, failed send, Oli is late */
  .notice { align-self: center; max-width: 90%; text-align: center; font-size: 12px; line-height: 1.6; color: var(--muted); padding: 4px 0; }
  .notice button { margin-left: 6px; background: none; border: none; color: var(--gold); font: inherit; cursor: pointer; text-decoration: underline; }

  /* Voice: tap the mic to speak, tap again to send */
  .mic-btn {
    flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
    background: none; border: 1px solid var(--border); color: var(--gold-soft);
    display: flex; align-items: center; justify-content: center;
  }
  .mic-btn.rec { background: #FF7A1F; border-color: #FF7A1F; color: #140A02; animation: recpulse 1.4s ease-in-out infinite; }
  .mic-btn:disabled { opacity: 0.4; cursor: default; }
  @keyframes recpulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,122,31,0.45); } 50% { box-shadow: 0 0 0 8px rgba(255,122,31,0); } }
  .rec-time { flex-shrink: 0; align-self: center; font-size: 12px; color: #FF7A1F; font-variant-numeric: tabular-nums; }
  .voice-row { display: flex; align-items: center; gap: 14px; margin-top: 12px; }
  .voice-play {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; cursor: pointer;
    background: transparent; border: 1px solid rgba(201,169,110,0.45); border-radius: 999px;
    color: var(--gold); font: inherit; font-size: 12px; letter-spacing: 0.04em;
  }
  .voice-save { color: var(--muted); font-size: 11px; letter-spacing: 0.04em; text-decoration: none; cursor: pointer; background: none; border: none; font-family: inherit; }
  .voice-save:hover { color: var(--gold-soft); }
  .msg.mine .voice-mark { display: block; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }

  /* ── AI CONSENT ── */
  .sheet-wrap {
    position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,0.7);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet {
    width: 100%; max-width: 480px; background: var(--card);
    border: 1px solid var(--border); border-bottom: none; border-radius: 16px 16px 0 0;
    padding: 28px 24px calc(24px + env(safe-area-inset-bottom));
  }
  .sheet h2 { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 24px; color: var(--champagne); margin-bottom: 14px; }
  .sheet p { font-size: 13px; line-height: 1.7; color: var(--text); opacity: 0.85; margin-bottom: 12px; }
  .sheet p.small { font-size: 11px; color: var(--muted); opacity: 1; }
  .sheet p a { color: var(--gold-soft); }
  .sheet .btn { margin-top: 10px; }

  /* ── CARDS: a fan of face-down cards right in the chat; the chosen one turns over ── */
  .card-fan { position: relative; height: 210px; margin: 6px 0 4px; --w: min(96px, 22vw); }
  .card-fan .fc {
    position: absolute; left: 50%; bottom: 8px; width: var(--w); aspect-ratio: 2/3; padding: 0; border: 0; background: none; cursor: pointer;
    transform-origin: 50% 125%; transform: translateX(-50%) rotate(var(--r));
    transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .45s; filter: drop-shadow(0 8px 14px rgba(0,0,0,.6));
  }
  .card-fan .fc:hover, .card-fan .fc:focus-visible { transform: translateX(-50%) rotate(var(--r)) translateY(-14px); outline: none; }
  .card-fan .fc svg { width: 100%; height: 100%; display: block; border-radius: 8px; }
  .card-fan.picked .fc { opacity: 0; pointer-events: none; }
  .card-fan.picked .fc.chosen { opacity: 1; transform: translateX(-50%) rotate(0) translateY(-24px) scale(1.15); }
  .card-hint { text-align: center; font-size: 12px; color: var(--muted); letter-spacing: .03em; }
  .card-img { display: block; width: 168px; max-width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 10px; margin: 2px 0 8px; border: 1px solid rgba(201,169,110,.3); }
  .reel-card { display: block; width: 150px; aspect-ratio: 2/3; object-fit: cover; margin: 0 auto; border-radius: 12px; border: 1px solid rgba(201,169,110,.35); animation: cardin 1s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes cardin { from { opacity: 0; transform: perspective(900px) rotateY(90deg) scale(.9); } to { opacity: 1; transform: none; } }

  /* ── REEL MODE (admin only): a clean 9:16 screen to record one question and Oli's spoken answer ── */
  .reel {
    position: fixed; inset: 0; z-index: 40; background: #050505;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(48px + env(safe-area-inset-top)) 28px calc(40px + env(safe-area-inset-bottom));
    cursor: pointer; user-select: none; -webkit-user-select: none;
  }
  .reel-q {
    max-width: 520px; min-height: 3.2em; text-align: center;
    font-size: 17px; line-height: 1.6; color: var(--text); opacity: 0.85; letter-spacing: 0.01em;
  }
  .reel .caret { display: inline-block; width: 1px; height: 1.1em; background: var(--gold); vertical-align: -0.2em; margin-left: 2px; animation: caret 1s steps(1) infinite; }
  @keyframes caret { 50% { opacity: 0; } }
  .reel-stage { width: 280px; height: 280px; margin: 28px 0; }
  .reel #flames { width: 280px; height: 280px; margin: 0; }
  .reel-cap {
    max-width: 560px; min-height: 5.4em; text-align: center;
    font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: 28px; line-height: 1.3;
    color: var(--champagne);
  }
  .reel-foot { position: absolute; bottom: calc(22px + env(safe-area-inset-bottom)); font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold-soft); }
  .reel-hint { position: absolute; top: calc(18px + env(safe-area-inset-top)); left: 0; right: 0; text-align: center; font-size: 11px; letter-spacing: 0.12em; color: var(--muted); }
  .reel-close { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 14px; background: none; border: none; color: var(--muted); font-size: 26px; cursor: pointer; padding: 6px 10px; }
  .reel.playing .reel-hint, .reel.playing .reel-close { display: none; }
  .voice-reel { color: var(--gold-soft); }

  /* ── GLASS SKIN (10 Oct 2026): Alexandra's cosmic portrait fills the screen, everything Oli shows sits on frosted glass.
     Desktop: Oli lives on the empty cosmos on the left. Phone: the face on top, the conversation below. ── */
  :root {
    --deep: #050816; --card: rgba(255,255,255,0.08); --border: rgba(255,255,255,0.18);
    --gold: #8fe9ff; --gold-soft: rgba(143,233,255,0.8); --champagne: #eef3ff;
    --text: #eef3ff; --muted: rgba(238,243,255,0.55);
    --glass-blur: blur(18px) saturate(150%);
    --edge-top: rgba(255,255,255,0.5);
  }
  html, body { background: var(--deep); }
  .bg { position: fixed; inset: 0; z-index: 0; background: url("oli-bg.webp") right center / cover no-repeat var(--deep); }
  .bg::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(5,8,22,.6) 0%, rgba(5,8,22,.2) 45%, rgba(5,8,22,0) 70%); }
  #loader, #login, #chat { position: relative; z-index: 1; }

  .glassy, .input-wrap, .menu, .sheet, .field, #chat {
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  }
  .field, .input-wrap { background: rgba(255,255,255,0.07); border-color: var(--border); }
  .field { border-radius: 14px; }
  .input-wrap { border-radius: 999px; border-top-color: var(--edge-top); box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
  .field:focus, .input-wrap:focus-within { border-color: rgba(143,233,255,0.6); }
  .menu, .sheet { background: rgba(14,20,44,0.62); border-color: var(--border); border-top-color: var(--edge-top); }
  .sheet-wrap { background: rgba(3,5,14,0.55); }

  /* Glass buttons: frosted fill, bright top edge, a soft cyan glow on hover */
  .btn, .oli-action, .voice-play, .send-btn, .mic-btn {
    color: var(--text);
    background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.06));
    -webkit-backdrop-filter: blur(14px) saturate(160%); backdrop-filter: blur(14px) saturate(160%);
    border: 1px solid rgba(255,255,255,.3); border-top-color: rgba(255,255,255,.65);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 4px 18px rgba(0,0,0,.25);
    transition: box-shadow .2s, background .2s, transform .1s;
  }
  .btn { border-radius: 999px; }
  .oli-action { display: inline-block; border-radius: 999px; padding: 10px 18px; margin-right: 8px; }
  .btn:hover, .oli-action:hover, .voice-play:hover, .send-btn:hover, .mic-btn:hover {
    box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 0 22px rgba(143,233,255,.45);
    background: linear-gradient(180deg, rgba(255,255,255,.3), rgba(255,255,255,.1));
  }
  .btn:active, .oli-action:active { transform: scale(.98); }
  .btn-line, .btn-line:hover { color: var(--text); background: linear-gradient(180deg, rgba(143,233,255,.38), rgba(143,233,255,.12)); border-color: rgba(143,233,255,.55); }
  .btn-line svg path { fill: #eef3ff; }
  .login-box .btn-gold, .login-box .btn-gold:hover { color: var(--text); border-color: rgba(255,255,255,.3); }
  .mic-btn.rec { color: #050816; background: var(--gold); border-color: var(--gold); animation: recpulse-glass 1.4s ease-in-out infinite; }
  @keyframes recpulse-glass { 0%, 100% { box-shadow: 0 0 0 0 rgba(143,233,255,.5); } 50% { box-shadow: 0 0 0 8px rgba(143,233,255,0); } }
  .rec-time { color: var(--gold); }

  /* Messages: Oli on clear glass, the person on a cyan tint */
  .msg.oli .bubble {
    padding: 12px 16px; max-width: 88%; border-radius: 18px 18px 18px 6px;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  }
  .msg.mine .bubble { border-radius: 18px 18px 6px 18px; background: rgba(143,233,255,.16); border: 1px solid rgba(143,233,255,.3); }
  .card-img { border-color: rgba(255,255,255,.3); }

  /* Login: no sphere here, the portrait is Oli */
  #login #flames { display: none; }
  .login-title { font-size: 56px; text-shadow: 0 0 30px rgba(143,233,255,.35); }
  .login-sub { color: rgba(238,243,255,.75); }
  .login-box { padding: 26px; border-radius: 24px; background: rgba(255,255,255,.06);
    border: 1px solid var(--border); border-top-color: var(--edge-top);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 10px 40px rgba(0,0,0,.35);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); }

  /* Desktop: one floating glass column over the empty cosmos on the left */
  @media (min-width: 761px) {
    #login { align-items: flex-start; padding-left: clamp(16px, 6vw, 96px); }
    #chat {
      position: fixed; z-index: 1; left: clamp(16px, 6vw, 96px); top: 24px; bottom: 24px; width: min(540px, calc(100vw - 32px));

    const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: HOME } })

  async function findOliMatch() {
    const { data } = await sb.from('matches').select('id')
      .or(`and(user1.eq.${OLI_ID},user2.eq.${me.id}),and(user1.eq.${me.id},user2.eq.${OLI_ID})`)

    const name = (meta.given_name || (meta.full_name || meta.name || '').split(' ')[0] || '').trim() || null

      const id = await findOliMatch()
      if (id) return id
      await new Promise(r => setTimeout(r, 1000))
    }
    const { data } = await sb.from('matches').insert({ user1: OLI_ID, user2: me.id }).select('id').single()
    return data?.id ?? await findOliMatch()
  }

  async function enter(user) {
    if (me) return
    me = user
    show('loader')
    try {
      await ensureProfile()
      matchId = await ensureMatch()
      if (!matchId) throw new Error('no chat')
    } catch (e) {
      console.error(e)
      me = null
      show('login')
      return setLoginMsg(T.error, true)
    }
    sb.from('profiles').select('is_admin').eq('id', me.id).maybeSingle().then(({ data }) => { isAdmin = !!data?.is_admin; if (isAdmin) { addReelButtons(); document.getElementById('forget-item').classList.remove('hidden') } })
    show('chat')
    document.getElementById('mic-btn').classList.toggle('hidden', !VOICE_ENABLED)
    if (!hasConsent()) document.getElementById('consent').classList.remove('hidden')
    await loadMessages()
    subscribe()
  }

  // ─── Consent to the AI ────────────────────────────────────
  function hasConsent() { return !!me?.user_metadata?.ai_consent_at }

  async function giveConsent() {
    const at = new Date().toISOString()
    const { data } = await sb.auth.updateUser({ data: { ai_consent_at: at } })
    me = data?.user ?? { ...me, user_metadata: { ...(me.user_metadata || {}), ai_consent_at: at } }
    document.getElementById('consent').classList.add('hidden')
    document.getElementById('msg-input').focus()
  }

  // ─── Messages ─────────────────────────────────────────────
  async function loadMessages() {
    const { data, error } = await sb.from('messages')
      .select('id, sender_id, content, meta, created_at')
      .eq('match_id', matchId)
      .order('created_at', { ascending: true })
    if (error) return notice(T.loadFail, loadMessages)
    const msgs = data || []
    acceptedOffers = new Set(msgs.filter(m => m.meta?.action === 'pdf_accept').map(m => m.meta.offer_id))
    drawnOffers = new Set(msgs.filter(m => ['card_drawn', 'card_declined'].includes(m.meta?.action)).map(m => m.meta.offer_id))
    const inner = document.getElementById('inner')
    inner.innerHTML = ''
    lastDate = null
    msgs.forEach(appendMessage)
    if (!msgs.length) showTyping()
    scrollDown()
  }

  // Oli's links (Origin Scan, readings, sessions) become tappable; everything else stays plain text.
  function appendText(el, text, links) {
    if (!links) { el.appendChild(document.createTextNode(text)); return }
    text.split(/(https:\/\/[^\s]+)/g).forEach((part, i) => {
      if (i % 2 === 0) { if (part) el.appendChild(document.createTextNode(part)); return }
      const url = part.replace(/[.,;:!?)»"']+$/, '')
      const a = document.createElement('a')
      a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = url
      el.appendChild(a)
      if (url.length < part.length) el.appendChild(document.createTextNode(part.slice(url.length)))
    })
  }

  function appendMessage(msg) {
    const inner = document.getElementById('inner')
    const d = new Date(msg.created_at).toDateString()
    if (d !== lastDate) {
      const sep = document.createElement('div')
      sep.className = 'msg-date'
      sep.textContent = formatDate(msg.created_at)
      inner.appendChild(sep)
      lastDate = d
    }
    const mine = msg.sender_id === me.id
    const row = document.createElement('div')
    row.className = 'msg ' + (mine ? 'mine' : 'oli')
    row.dataset.id = msg.id
    const bubble = document.createElement('div')
    bubble.className = 'bubble'
    if (mine && msg.meta?.voice_in !== undefined) {
      const mark = document.createElement('span')
      mark.className = 'voice-mark'
      mark.textContent = '🎙 ' + T.voiceMark
      bubble.appendChild(mark)
    }
    appendText(bubble, msg.content || '', !mine)
    row.appendChild(bubble)
    if (!mine && msg.meta?.audio) addVoicePlayer(bubble, msg.meta.audio, false, msg.content || '')

    // A drawn card shows as the picture itself.
    if (mine && msg.meta?.action === 'card_drawn' && msg.meta.card) {
      const img = document.createElement('img')
      img.className = 'card-img'
      img.src = CARD_BASE + msg.meta.card
      img.alt = ''
      bubble.insertBefore(img, bubble.firstChild)
      row.dataset.card = msg.meta.card
    }
    // Oli invites a card: the button opens a fan of face-down cards right here.
    if (!mine && msg.meta?.action === 'card_offer' && DECKS[msg.meta.deck]) {
      const btn = document.createElement('button')
      btn.className = 'oli-action'
      btn.textContent = T.drawCard
      btn.disabled = drawnOffers.has(msg.id)
      btn.onclick = () => openCardFan(msg, btn)
      const no = document.createElement('button')
      no.className = 'oli-action'
      no.textContent = T.notNow
      no.disabled = btn.disabled
      no.onclick = () => declineCard(msg, btn, no)
      const pair = document.createElement('div')
      pair.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap'
      btn.style.marginTop = no.style.marginTop = '12px'
      pair.append(btn, no)
      bubble.appendChild(pair)
    }
    // Oli's reading offer comes with a button; pressing it is the same as answering "yes".
    if (!mine && msg.meta?.action === 'pdf_offer') {
      const btn = document.createElement('button')
      btn.className = 'oli-action'
      btn.textContent = msg.meta.lang === 'ru' ? 'Попросить Alexandra прочитать нас' : 'Ask Alexandra to read us'
      btn.disabled = acceptedOffers.has(msg.id)
      btn.onclick = () => acceptOffer(msg, btn)
      bubble.appendChild(btn)
    }
    // Oli's links arrive as buttons (meta.links), never as raw URLs in her words.
    if (!mine && Array.isArray(msg.meta?.links)) {
      const wrap = document.createElement('div')
      wrap.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;margin-top:12px'
      for (const l of msg.meta.links) {
        if (!/^https:\/\//.test(l?.url || '')) continue
        const a = document.createElement('a')
        a.className = 'oli-action'
        a.style.textDecoration = 'none'
        a.href = l.url
        a.target = '_blank'
        a.rel = 'noopener'
        a.textContent = l.label || 'Open'
        wrap.appendChild(a)
      }
      if (wrap.children.length) bubble.appendChild(wrap)
    }
    // Plan upgrade: the button appears only once a payment link exists (meta.url); until then it is just Oli's words.
    if (!mine && msg.meta?.action === 'upgrade' && msg.meta.url) {
      const a = document.createElement('a')
      a.className = 'oli-action'
      a.style.textDecoration = 'none'
      a.href = msg.meta.url
      a.textContent = msg.meta.lang === 'ru' ? 'Продолжить без лимита' : 'Continue without a limit'
      bubble.appendChild(a)
    }
    const typing = document.getElementById('typing')
    typing ? inner.insertBefore(row, typing) : inner.appendChild(row)
  }

  async function acceptOffer(offer, btn) {
    if (!hasConsent()) return document.getElementById('consent').classList.remove('hidden')
    btn.disabled = true
    acceptedOffers.add(offer.id)
    const { error } = await sb.from('messages').insert({
      match_id: matchId, sender_id: me.id, content: btn.textContent,
      meta: { action: 'pdf_accept', offer_id: offer.id, pair: offer.meta.pair, person_id: offer.meta.person_id ?? null, lang: offer.meta.lang },
    })
    if (error) { btn.disabled = false; acceptedOffers.delete(offer.id); setHaloState('idle'); notice(T.sendFail) }
    else { setHaloState('thinking'); showTyping() }
  }

  async function sendMessage() {
    const input = document.getElementById('msg-input')
    const content = input.value.trim()
    if (!content || !matchId) return
    if (!hasConsent()) return document.getElementById('consent').classList.remove('hidden')
    input.value = ''
    autoResize(input)
    setHaloState('thinking')
    const btn = document.getElementById('send-btn')
    if (btn.disabled) return
    btn.disabled = true
    const { data, error } = await sb.from('messages').insert({ match_id: matchId, sender_id: me.id, content }).select('id, sender_id, content, meta, created_at').single()
    btn.disabled = false
    if (error) { input.value = content; autoResize(input); setHaloState('writing'); return notice(T.sendFail) }
    clearNotices()
    if (!document.querySelector(`[data-id="${data.id}"]`)) appendMessage(data)
    autoPlayNext = true
    showTyping()
  }

  function subscribe() {
    if (channel) sb.removeChannel(channel)
    channel = sb.channel(`oli:${matchId}`)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `match_id=eq.${matchId}` }, ({ new: msg }) => {
        if (document.querySelector(`[data-id="${msg.id}"]`)) return
        if (msg.sender_id === OLI_ID) { hideTyping(); setHaloState('responding') }
        appendMessage(msg)
        scrollDown()
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages', filter: `match_id=eq.${matchId}` }, ({ new: msg }) => {
        // Oli's voice is added to her message a moment after the text.
        const bubble = document.querySelector(`[data-id="${msg.id}"] .bubble`)
        if (!bubble || !msg.meta?.audio || bubble.querySelector('.voice-row')) return
        addVoicePlayer(bubble, msg.meta.audio, autoPlayNext, msg.content || '')
        autoPlayNext = false
      })
      .subscribe(status => {
        // The connection dropped: try again in a few seconds and catch up on anything missed.
        if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') setTimeout(resync, 4000)
      })
  }

  async function resync() {
    if (!matchId || !navigator.onLine) return
    clearNotices()
    await loadMessages()
    subscribe()
  }
  window.addEventListener('online', resync)
  window.addEventListener('offline', () => matchId && notice(T.offline))
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') resync() })

  function notice(text, retry) {
    clearNotices()
    const el = document.createElement('div')
    el.className = 'notice'
    el.textContent = text
    if (retry) {
      const b = document.createElement('button')
      b.textContent = T.retry
      b.onclick = () => { clearNotices(); retry() }
      el.appendChild(b)
    }
    document.getElementById('inner').appendChild(el)
    scrollDown()
  }
  function clearNotices() { document.querySelectorAll('.notice').forEach(n => n.remove()) }

  // Dots while Oli is writing; they go away when her message lands (or after a minute).
  function showTyping() {
    hideTyping()
    const el = document.createElement('div')
    el.id = 'typing'
    el.className = 'typing'
    el.innerHTML = '<span></span><span></span><span></span>'
    document.getElementById('inner').appendChild(el)
    scrollDown()
    typingTimer = setTimeout(() => { hideTyping(); notice(T.late) }, 60000)
  }
  function hideTyping() {
    clearTimeout(typingTimer)
    document.getElementById('typing')?.remove()
  }

  // ─── UI helpers ───────────────────────────────────────────
  function handleKey(e) {
    // Enter sends on a keyboard; on phones Enter is a new line and the arrow sends.
    if (e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) { e.preventDefault(); sendMessage() }
  }
  function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 160) + 'px' }
  // ─── Voice ────────────────────────────────────────────────
  // Tap the mic, speak, tap again: the note goes to oli-voice, comes back as text in the chat,
  // and Oli answers with her voice, which plays by itself.
  let recorder = null, recChunks = [], recTimer = null, recStart = 0, autoPlayNext = false
  const MAX_REC_MS = 120000

  function pickMime() {
    for (const m of ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg']) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported?.(m)) return m
    }
    return ''
  }

  async function toggleRecording() {
    if (recorder?.state === 'recording') return recorder.stop()
    if (!hasConsent()) return document.getElementById('consent').classList.remove('hidden')
    let stream
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }) }
    catch { return notice(T.micDenied) }
    const mime = pickMime()
    recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined)
    recChunks = []
    recorder.ondataavailable = e => { if (e.data.size) recChunks.push(e.data) }
    recorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop())
      clearInterval(recTimer)
      document.getElementById('mic-btn').classList.remove('rec')
      document.getElementById('rec-time').classList.add('hidden')
      const blob = new Blob(recChunks, { type: (recorder.mimeType || mime || 'audio/webm').split(';')[0] })
      if (Date.now() - recStart > 700) sendVoice(blob)
    }
    recorder.start()
    recStart = Date.now()
    document.getElementById('mic-btn').classList.add('rec')
    const time = document.getElementById('rec-time')
    time.classList.remove('hidden')
    time.textContent = '0:00'
    setHaloState('writing')
    recTimer = setInterval(() => {
      const sec = Math.floor((Date.now() - recStart) / 1000)
      time.textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`
      if (Date.now() - recStart >= MAX_REC_MS) recorder.stop()
    }, 250)
  }

  async function sendVoice(blob) {
    const mic = document.getElementById('mic-btn')
    mic.disabled = true
    setHaloState('thinking')
    showTyping()
    const ext = { 'audio/mp4': 'm4a', 'audio/ogg': 'ogg' }[blob.type] || 'webm'
    const form = new FormData()
    form.append('audio', blob, `voice.${ext}`)
    const { data: { session } } = await sb.auth.getSession()
    const res = await fetch(`${SUPABASE_URL}/functions/v1/oli-voice`, {
      method: 'POST', headers: { 'Authorization': `Bearer ${session?.access_token}`, 'apikey': SUPABASE_ANON_KEY }, body: form,
    }).catch(() => null)
    mic.disabled = false
    const out = res ? await res.json().catch(() => ({})) : {}
    if (!res || !res.ok) {
      hideTyping(); setHaloState('idle')
      if (out.error === 'consent_required') return document.getElementById('consent').classList.remove('hidden')
      return notice(out.error === 'empty' ? T.voiceEmpty : out.error === 'too_long' ? T.voiceLong : T.voiceFail)
    }
    clearNotices()
    autoPlayNext = true
    if (out.message && !document.querySelector(`[data-id="${out.message.id}"]`)) appendMessage(out.message)
    scrollDown()
  }

  let playing = null, isAdmin = false
  function addVoicePlayer(bubble, path, autoplay = false, text = '') {
    const wrap = document.createElement('div')
    wrap.className = 'voice-row'
    const play = document.createElement('button')
    play.className = 'voice-play'
    play.innerHTML = `<span aria-hidden="true">▶</span><span>${T.listen}</span>`
    const save = document.createElement('button')
    save.className = 'voice-save'
    save.textContent = T.save
    wrap.append(play, save)
    wrap.dataset.path = path
    wrap.dataset.text = text
    bubble.appendChild(wrap)
    if (isAdmin) addReelButton(wrap)
    let audio = null
    const url = async () => (await sb.storage.from('oli-voice').createSignedUrl(path, 3600)).data?.signedUrl
    const setLabel = on => { play.innerHTML = `<span aria-hidden="true">${on ? '❚❚' : '▶'}</span><span>${on ? T.pause : T.listen}</span>` }
    play.onclick = async () => {
      if (audio && !audio.paused) { audio.pause(); return }
      if (!audio) {
        const u = await url(); if (!u) return
        audio = new Audio(u)
        audio.onplay = () => { if (playing && playing !== audio) playing.pause(); playing = audio; setLabel(true) }
        audio.onpause = audio.onended = () => setLabel(false)
      }
      audio.play().catch(() => setLabel(false))
    }
    // Save the voice file, e.g. to put Oli's answer into a Reel.
    save.onclick = async () => {
      const u = await url(); if (!u) return
      const blob = await fetch(u).then(r => r.blob())
      const a = document.createElement('a')
      a.href = URL.createObjectURL(blob)
      a.download = `oli-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-')}.mp3`
      a.click()
      setTimeout(() => URL.revokeObjectURL(a.href), 5000)
    }
    if (autoplay) play.click()
    scrollDown()
  }

  function openCardFan(offer, btn) {
    if (!hasConsent()) return document.getElementById('consent').classList.remove('hidden')
    if (btn.disabled || document.querySelector('.card-fan')) return
    btn.parentElement.querySelectorAll('button').forEach(b => { b.disabled = true })
    const deck = DECKS[offer.meta.deck]
    const picks = [...deck].sort(() => Math.random() - 0.5).slice(0, 7)
    const wrap = document.createElement('div')
    const hint = document.createElement('div')
    hint.className = 'card-hint'
    hint.textContent = T.cardPick
    const fan = document.createElement('div')
    fan.className = 'card-fan'
    picks.forEach((card, i) => {
      const c = document.createElement('button')
      c.className = 'fc'
      c.style.setProperty('--r', `${(i - 3) * 9}deg`)
      c.setAttribute('aria-label', `${i + 1}`)
      c.innerHTML = '<svg><use href="#cardBack"/></svg>'
      c.onclick = () => pickCard(offer, fan, c, card, wrap)
      fan.appendChild(c)
    })
    wrap.append(hint, fan)
    document.getElementById('inner').appendChild(wrap)
    scrollDown()
  }

  // "Not now": Oli simply goes on from where the conversation was.
  async function declineCard(offer, btn, no) {
    if (!hasConsent()) return document.getElementById('consent').classList.remove('hidden')
    btn.disabled = no.disabled = true
    const { data, error } = await sb.from('messages')
      .insert({ match_id: matchId, sender_id: me.id, content: T.notNow, meta: { action: 'card_declined', offer_id: offer.id } })
      .select('id, sender_id, content, meta, created_at').single()
    if (error) { btn.disabled = no.disabled = false; return notice(T.sendFail) }
    drawnOffers.add(offer.id)
    if (!document.querySelector(`[data-id="${data.id}"]`)) appendMessage(data)
    autoPlayNext = true
    setHaloState('thinking')
    showTyping()
  }

  async function pickCard(offer, fan, el, card, wrap) {
    if (fan.classList.contains('picked')) return
    fan.classList.add('picked')
    el.classList.add('chosen')
    new Image().src = CARD_BASE + card  // start loading the picture while the card rises
    await new Promise(r => setTimeout(r, 650))
    const { data, error } = await sb.from('messages')
      .insert({ match_id: matchId, sender_id: me.id, content: T.cardMsg, meta: { action: 'card_drawn', deck: offer.meta.deck, card, offer_id: offer.id } })
      .select('id, sender_id, content, meta, created_at').single()
    wrap.remove()
    if (error) { document.querySelector(`[data-id="${offer.id}"] .oli-action`)?.removeAttribute('disabled'); return notice(T.sendFail) }
    drawnOffers.add(offer.id)
    if (!document.querySelector(`[data-id="${data.id}"]`)) appendMessage(data)
    autoPlayNext = true
    setHaloState('thinking')
    showTyping()
  }

  // ─── Reel mode (Olesya only) ──────────────────────────────
  // Her question types itself out, the crystal thinks, then Oli answers aloud with large captions.
  function addReelButtons() { document.querySelectorAll('.voice-row').forEach(addReelButton) }
  function addReelButton(wrap) {
    if (wrap.querySelector('.voice-reel')) return
    const b = document.createElement('button')
    b.className = 'voice-save voice-reel'
    b.textContent = '🎬 ' + T.reel
    b.onclick = () => openReel(wrap)
    wrap.appendChild(b)
  }

  let reel = null
  function openReel(wrap) {
    // The question is the person's message just above this answer.
    let q = wrap.closest('.msg')?.previousElementSibling
    while (q && !q.classList.contains('mine')) q = q.previousElementSibling
    const question = q ? [...q.querySelector('.bubble').childNodes].filter(n => n.nodeType === 3).map(n => n.textContent).join('').trim() : ''
    reel = { path: wrap.dataset.path, text: wrap.dataset.text, question, card: q?.dataset.card || null, audio: null, busy: false }
    document.getElementById('reel-q').textContent = ''
    document.getElementById('reel-cap').textContent = ''
    const el = document.getElementById('reel')
    el.classList.remove('hidden', 'playing')
    document.getElementById('reel-stage').appendChild(document.getElementById('flames'))
    window.dispatchEvent(new Event('resize'))
    setHaloState('idle')
  }

  function closeReel(e) {
    e?.stopPropagation()
    if (reel?.audio) reel.audio.pause()
    reel = null
    document.getElementById('reel').classList.add('hidden')
    mountHaloInHeader(true)
    setHaloState('idle')
  }

  // Captions: sentences, long ones split at commas, each shown for a share of the voice by its length.
  function captionChunks(text) {
    const clean = text.replace(/https?:\/\/\S+/g, '').replace(/\s+/g, ' ').trim()
    const out = []
    for (const sentence of clean.split(/(?<=[.!?…])\s+/)) {
      if (sentence.length <= 110) { out.push(sentence); continue }
      let cur = ''
      for (const part of sentence.split(/(?<=[,;:])\s+/)) {
        if (cur && (cur + ' ' + part).length > 110) { out.push(cur); cur = part } else cur = cur ? cur + ' ' + part : part
      }
      if (cur) out.push(cur)
    }
    return out.filter(Boolean)
  }

  async function reelTap(e) {
    if (!reel || reel.busy || e.target.closest('.reel-close')) return
    reel.busy = true
    const el = document.getElementById('reel')
    el.classList.add('playing')
    const qEl = document.getElementById('reel-q'), cap = document.getElementById('reel-cap')
    qEl.textContent = ''; cap.textContent = ''
    const url = (await sb.storage.from('oli-voice').createSignedUrl(reel.path, 3600)).data?.signedUrl
    if (!url || !reel) { if (reel) reel.busy = false; el.classList.remove('playing'); return }
    const audio = reel.audio = new Audio(url)
    audio.preload = 'auto'

    // 1. The question types itself out, or the drawn card turns over.
    if (reel.card) {
      qEl.innerHTML = `<img class="reel-card" src="${CARD_BASE + reel.card}" alt="">`
      await new Promise(r => setTimeout(r, 1600))
    } else {
      const caret = '<span class="caret"></span>'
      for (let i = 1; i <= reel.question.length; i++) {
        if (!reel) return
        qEl.innerHTML = escapeHtml(reel.question.slice(0, i)) + caret
        await new Promise(r => setTimeout(r, 38))
      }
      qEl.textContent = reel.question
    }
    // 2. Oli thinks.
    setHaloState('thinking')
    await new Promise(r => setTimeout(r, 1400))
    if (!reel) return
    // 3. Oli speaks, captions follow her voice.
    const chunks = captionChunks(reel.text)
    const total = chunks.reduce((n, c) => n + c.length, 0) || 1
    const bounds = []; let acc = 0
    for (const c of chunks) { acc += c.length; bounds.push(acc / total) }
    // The answer types itself out in time with her voice, sentence by sentence.
    const starts = [0, ...bounds.slice(0, -1)]
    let raf = 0
    const tick = () => {
      if (!reel || audio.paused && !audio.ended) return
      const f = audio.duration ? Math.min(audio.currentTime / audio.duration, 1) : 0
      let idx = bounds.findIndex(b => f < b)
      if (idx < 0) idx = chunks.length - 1
      const local = (f - starts[idx]) / Math.max(bounds[idx] - starts[idx], 0.0001)
      const n = Math.max(1, Math.min(chunks[idx].length, Math.round(local * chunks[idx].length * 1.08)))
      cap.innerHTML = escapeHtml(chunks[idx].slice(0, n)) + (n < chunks[idx].length ? '<span class="caret"></span>' : '')
      if (!audio.ended) raf = requestAnimationFrame(tick)
    }
    audio.onplay = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(tick) }
    audio.onended = () => {
      cancelAnimationFrame(raf)
      cap.textContent = chunks[chunks.length - 1] || ''
      setTimeout(() => { if (!reel) return; reel.busy = false; el.classList.remove('playing') }, 1800)
    }
    // While she speaks the crystal just breathes; no flashes.
    setHaloState('idle')
    audio.play().catch(() => { reel.busy = false; el.classList.remove('playing') })
  }

  function escapeHtml(str) { return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])) }

  function scrollDown() { const m = document.getElementById('messages'); m.scrollTop = m.scrollHeight }
  function toggleMenu(e) { e.stopPropagation(); document.getElementById('menu').classList.toggle('hidden') }
  document.addEventListener('click', () => document.getElementById('menu').classList.add('hidden'))
  function formatDate(iso) {
    const d = new Date(iso), today = new Date(), y = new Date(); y.setDate(today.getDate() - 1)
    if (d.toDateString() === today.toDateString()) return RU ? 'Сегодня' : 'Today'
    if (d.toDateString() === y.toDateString()) return RU ? 'Вчера' : 'Yesterday'
    return d.toLocaleDateString(RU ? 'ru-RU' : 'en-US', { day: 'numeric', month: 'long' })
  }

  // ─── Start ────────────────────────────────────────────────
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {})
  }

  sb.auth.onAuthStateChange((event, session) => {
    if (session?.user && !me) setTimeout(() => enter(session.user), 0)
  })
  sb.auth.getSession().then(({ data }) => {
    if (data.session?.user) enter(data.session.user)
    else show('login')
  })
</script>

<script type="module">
  import * as THREE from 'three'

  const canvas = document.getElementById('flames')
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true })
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2))
  renderer.toneMapping = THREE.ACESFilmicToneMapping
  renderer.toneMappingExposure = 1.15

  const scene = new THREE.Scene()
  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100)
  camera.position.set(0, 0, 4.6)
  const group = new THREE.Group()
  scene.add(group)

  const coreMat = new THREE.MeshPhysicalMaterial({
    color: 0x100a04, metalness: 0.78, roughness: 0.22,
    clearcoat: 1, clearcoatRoughness: 0.04,
    emissive: 0xb86a24, emissiveIntensity: 0.28,
  })
  const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.68, 1), coreMat)
  group.add(core)

  // A glass shell, like the crystal on starseedsoultype.com: flat facets catch the light one by one.
  const shellMat = new THREE.MeshPhysicalMaterial({
    color: 0x2a2118, metalness: 0.1, roughness: 0.0,
    transmission: 0.85, thickness: 0.5, ior: 1.5,
    clearcoat: 1, clearcoatRoughness: 0.0, flatShading: true,
    transparent: true, opacity: 0.42,
    depthWrite: false,
  })
  const shellGeo = new THREE.IcosahedronGeometry(0.98, 1)
  const shell = new THREE.Mesh(shellGeo, shellMat)
  group.add(shell)

  // The gold facet lines always stay visible: they breathe together with the shell
  // (as its child) and sit a hair above it, so the glassy shell can never cover them.
  const EDGE_BASE = 0.34
  const edgeMat = new THREE.LineBasicMaterial({ color: 0xe8d5a8, transparent: true, opacity: EDGE_BASE })
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(shellGeo), edgeMat)
  edges.scale.setScalar(1.006)
  edges.renderOrder = 2
  shell.add(edges)

  function orbitMaterial(offset) {
    return new THREE.ShaderMaterial({
      uniforms: {
        uColor: { value: new THREE.Color(0xc9a96e) },
        uOpacity: { value: 0.86 },
        uOffset: { value: offset },
      },
      vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        varying vec2 vUv;
        uniform vec3 uColor;
        uniform float uOpacity;
        uniform float uOffset;
        void main() {
          float u = fract(vUv.x + uOffset);
          float fadeIn = smoothstep(0.0, 0.18, u);
          float fadeOut = 1.0 - smoothstep(0.82, 1.0, u);
          float fade = fadeIn * fadeOut;
          gl_FragColor = vec4(uColor, uOpacity * fade);
        }
      `,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
    })
  }
  const orbit = new THREE.Mesh(new THREE.TorusGeometry(1.28, 0.006, 8, 128), orbitMaterial(0.02))
  orbit.rotation.x = Math.PI / 2
  group.add(orbit)
  const orbit2 = orbit.clone()
  orbit2.material = orbitMaterial(0.48)
  orbit2.rotation.y = Math.PI / 3
  group.add(orbit2)

  const wave = new THREE.Mesh(
    new THREE.TorusGeometry(1.01, 0.014, 12, 96),
    new THREE.MeshBasicMaterial({ color: 0xff9b62, transparent: true, opacity: 0, blending: THREE.AdditiveBlending })
  )
  group.add(wave)

  function glowTexture() {
    const c = document.createElement('canvas'); c.width = c.height = 128
    const x = c.getContext('2d'), g = x.createRadialGradient(64, 64, 0, 64, 64, 64)
    g.addColorStop(0, 'rgba(255,244,209,1)')
    g.addColorStop(0.16, 'rgba(255,181,76,0.72)')
    g.addColorStop(0.48, 'rgba(218,129,28,0.22)')
    g.addColorStop(1, 'rgba(10,10,10,0)')
    x.fillStyle = g; x.fillRect(0, 0, 128, 128)
    return new THREE.CanvasTexture(c)
  }
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTexture(), color: 0xffa43d, transparent: true,
    opacity: 0.14, blending: THREE.AdditiveBlending, depthWrite: false,
  }))
  glow.scale.set(1.8, 1.8, 1)
  group.add(glow)

  const thoughtA = glow.clone(), thoughtB = glow.clone()
  thoughtA.material = thoughtA.material.clone(); thoughtB.material = thoughtB.material.clone()
  thoughtA.material.color.set(0xffe0b0); thoughtB.material.color.set(0xffa43d)
  thoughtA.material.opacity = thoughtB.material.opacity = 0
  thoughtA.scale.setScalar(0.72); thoughtB.scale.setScalar(0.72)
  group.add(thoughtA, thoughtB)

  const warmLight = new THREE.PointLight(0xffa03e, 0.85, 4.2)
  warmLight.position.set(0, 0, 0.35)
  scene.add(warmLight)
  const champagneLight = new THREE.DirectionalLight(0xffe7c5, 2.6)
  champagneLight.position.set(2.5, 3.5, 4)
  scene.add(champagneLight)
  const rimLight = new THREE.DirectionalLight(0xc9a96e, 1.8)
  rimLight.position.set(-3.5, 1.5, 2.5)
  scene.add(rimLight)
  // Every few seconds a light sweeps across the glass and the facets flash.
  const glintLight = new THREE.PointLight(0xfff1d6, 0, 3.2, 1.2)
  scene.add(glintLight)
  const GLINT_EVERY = 6.5, GLINT_LENGTH = 1.3
  scene.add(new THREE.AmbientLight(0xffeee0, 0.24))

  let state = 'idle', started = false, responseAt = -10
  let pointerX = 0, pointerY = 0, smoothX = 0, smoothY = 0
  let elapsed = 0
  window.addEventListener('pointermove', e => {
    pointerX = (e.clientX / window.innerWidth - 0.5) * 2
    pointerY = (e.clientY / window.innerHeight - 0.5) * 2
  })
  window.addEventListener('oli-halo-state', e => {
    state = e.detail || 'idle'
    if (state === 'responding') responseAt = elapsed
  })

  function resize() {
    const w = canvas.clientWidth || 220, h = canvas.clientHeight || 220
    renderer.setSize(w, h, false)
    camera.aspect = w / h
    camera.updateProjectionMatrix()
  }
  resize(); window.addEventListener('resize', resize)

  // The core slowly travels through pastel colours: orange, yellow, turquoise, sky blue, violet,
  // then sinks into darkness and starts again. Brightness b dims the light at the dark stop.
  const CORE_COLOURS = [
    { c: new THREE.Color(0xff9a5c), b: 1 },    // pastel orange
    { c: new THREE.Color(0xffd95a), b: 1 },    // pastel yellow
    { c: new THREE.Color(0x45dcc4), b: 1 },    // turquoise
    { c: new THREE.Color(0x68b4ff), b: 1 },    // sky blue
    { c: new THREE.Color(0xa987ff), b: 1 },    // violet
    { c: new THREE.Color(0x2a1d14), b: 0.15 }, // into the dark
  ]
  const CYCLE_SECONDS = 30
  const coreColour = new THREE.Color()
  function colourAt(t) {
    const n = CORE_COLOURS.length, x = (t / CYCLE_SECONDS % 1) * n
    const i = Math.floor(x), f = x - i, k = f * f * (3 - 2 * f)
    const a = CORE_COLOURS[i], z = CORE_COLOURS[(i + 1) % n]
    coreColour.copy(a.c).lerp(z.c, k)
    return a.b + (z.b - a.b) * k
  }

  function animate(now) {
    requestAnimationFrame(animate)
    elapsed = now * 0.001
    const thinking = state === 'thinking'
    const writing = state === 'writing'
    const responding = state === 'responding'
    const slow = reduced ? 0 : 1
    const breath = 1 + (writing ? 0.018 : 0.035) * Math.sin(elapsed * (writing ? 1.7 : 0.78))
    const idle = !writing && !thinking && !responding
    const intensity = writing ? 0.40 : thinking ? 0.46 : responding ? 0.62 : 0.28 + 0.08 * Math.sin(elapsed * 0.82)
    const bright = colourAt(elapsed)
    coreMat.emissive.copy(coreColour)
    coreMat.emissiveIntensity = intensity * 2.1 * bright
    coreMat.color.copy(coreColour).multiplyScalar(0.22 * bright)
    warmLight.color.copy(coreColour)
    glow.material.color.copy(coreColour)
    warmLight.intensity = writing ? 1.0 : thinking ? 1.15 : responding ? 1.55 : 0.85 + 0.14 * Math.sin(elapsed * 0.82)
    warmLight.intensity *= bright
    const corePulse = idle ? 1 + 0.045 * Math.sin(elapsed * 0.82) : 1
    core.scale.setScalar(breath * corePulse * (writing ? 0.96 : 1))
    shell.scale.setScalar(1 + (thinking ? 0.012 : 0.006) * Math.sin(elapsed * 0.7))
    glow.material.opacity = (writing ? 0.20 : thinking ? 0.24 : responding ? 0.32 : 0.14) * (idle ? 0.92 + 0.18 * Math.sin(elapsed * 0.82) : 0.98) * (0.4 + 0.6 * bright)
    glow.scale.setScalar((writing ? 1.65 : responding ? 2.15 : 1.8) * breath)

    const distance = thinking ? 0.20 + 0.16 * (0.5 + 0.5 * Math.sin(elapsed * 0.85)) : 0
    thoughtA.position.set(-distance, Math.sin(elapsed * 0.7) * 0.04, 0.35)
    thoughtB.position.set(distance, -Math.sin(elapsed * 0.7) * 0.04, 0.35)
    thoughtA.material.opacity = thoughtB.material.opacity = thinking ? 0.52 : 0
    thoughtA.scale.setScalar(thinking ? 0.62 : 0.72); thoughtB.scale.copy(thoughtA.scale)

    smoothX += (pointerX - smoothX) * 0.035
    smoothY += (pointerY - smoothY) * 0.035
    group.rotation.y = elapsed * (writing ? 0.022 : 0.038) * slow + smoothX * 0.10 * slow
    group.rotation.x = Math.sin(elapsed * 0.18) * 0.055 * slow + smoothY * 0.08 * slow
    orbit.rotation.z += (writing ? 0.0007 : responding ? 0.018 : 0.0017) * slow
    orbit.rotation.x = Math.PI / 2 + Math.sin(elapsed * 0.12) * 0.08
    orbit2.rotation.z -= (writing ? 0.00045 : responding ? 0.012 : 0.00125) * slow
    orbit2.rotation.x = Math.PI / 2 + Math.sin(elapsed * 0.14 + 1.2) * 0.06
    orbit2.rotation.y = Math.PI / 3 + smoothX * 0.035 * slow

    const pulse = responding ? Math.min((elapsed - responseAt) / 1.1, 1) : 0
    wave.scale.setScalar(1 + pulse * 0.34)
    wave.material.opacity = responding ? 0.7 * (1 - pulse) : 0
    const gp = (elapsed % GLINT_EVERY) / GLINT_LENGTH
    const glint = gp < 1 && !reduced ? Math.sin(Math.PI * gp) ** 2 : 0
    glintLight.intensity = 30 * glint
    glintLight.position.set(-1.6 + 3.2 * Math.min(gp, 1), 0.9 - 0.6 * Math.min(gp, 1), 1.55)
    edgeMat.opacity = EDGE_BASE + 0.4 * glint
    renderer.render(scene, camera)
  }

  window.oliHaloStart = () => { if (!started) { started = true; resize(); requestAnimationFrame(animate) } }
  window.dispatchEvent(new Event('oli-halo-ready'))
  if (!document.getElementById('login').classList.contains('hidden')) window.oliHaloStart()
</script>
